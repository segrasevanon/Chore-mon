version: '3.9'

services:

  # ── Azure SQL Database equivalent ─────────────────────────────────────────
  # Exact same engine as Azure SQL Database. Zero schema migration on go-live.
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Local_Dev_P@ss1"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
        -P "Local_Dev_P@ss1" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Azure Blob Storage equivalent (MinIO) ─────────────────────────────────
  # MinIO implements Azure Blob SDK — swap one env var to switch to Azure.
  blob:
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO console → http://localhost:9001
    volumes:
      - blobdata:/bitnami/minio/data

  # ── Backend API ───────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override DB_HOST to point at the Docker service, not localhost
      DB_HOST: db
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      blob:
        condition: service_started
    restart: on-failure

volumes:
  sqldata:
  blobdata:
  uploads:
