<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#60758B"/></marker><marker id="one" markerWidth="12" markerHeight="16" refX="10" refY="8" orient="auto-start-reverse"><path d="M2 1 V15 M7 1 V15" fill="none" stroke="#60758B" stroke-width="2"/></marker><marker id="many" markerWidth="25" markerHeight="20" refX="24" refY="10" orient="auto"><circle cx="6" cy="10" r="4" fill="white" stroke="#60758B" stroke-width="1.5"/><path d="M12 10 L24 2 M12 10 L24 10 M12 10 L24 18" fill="none" stroke="#60758B" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="37" font-family="Arial" font-size="27" font-weight="bold" fill="#183B56">Trust boundaries and sensitive data flows</text><rect x="25" y="70" width="420" height="790" rx="8" fill="#FBFDFF" stroke="#B7CADA" stroke-width="2"/><text x="43" y="101" text-anchor="start" font-family="Arial" font-size="23" fill="#183B56"><tspan x="43" dy="0">Shared device path</tspan></text><rect x="70" y="145" width="330" height="90" rx="10" fill="#DBEAFE" stroke="#CBD5E1" stroke-width="2"/><text x="235" y="185" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="235" dy="0">TB1 Child or adult</tspan><tspan x="235" dy="26.4">Android UI and PIN gate</tspan></text><path d="M235 235 V340" fill="none" stroke="#60758B" stroke-width="2"  marker-end="url(#arrow)" /><rect x="70" y="340" width="330" height="110" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="235" y="390" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="235" dy="0">TB2 Private game JSON</tspan><tspan x="235" dy="26.4">and selected media URIs</tspan></text><text x="235" y="550" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="235" dy="0">Device sandbox is trusted</tspan><tspan x="235" dy="26.4">Local PIN gates management</tspan><tspan x="235" dy="26.4">Local profiles share data</tspan></text><rect x="475" y="70" width="700" height="790" rx="8" fill="#FBFDFF" stroke="#B7CADA" stroke-width="2"/><text x="493" y="101" text-anchor="start" font-family="Arial" font-size="23" fill="#183B56"><tspan x="493" dy="0">Independent network API path</tspan></text><rect x="645" y="140" width="360" height="80" rx="10" fill="#EDE9FE" stroke="#CBD5E1" stroke-width="2"/><text x="825" y="188" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="825" dy="0">External API actor</tspan></text><path d="M825 220 V280" fill="none" stroke="#60758B" stroke-width="2"  marker-end="url(#arrow)" /><rect x="615" y="280" width="420" height="95" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="825" y="322.5" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="825" dy="0">TB3 Ktor JWT validation</tspan><tspan x="825" dy="26.4">and route authorization</tspan></text><path d="M720 375 V455" fill="none" stroke="#60758B" stroke-width="2"  marker-end="url(#arrow)" /><path d="M925 375 V455" fill="none" stroke="#60758B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="505" y="455" width="320" height="110" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="665" y="505" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="665" dy="0">TB4 SQL and local files</tspan><tspan x="665" dy="26.4">Tenant data and rewards</tspan></text><rect x="850" y="455" width="290" height="110" rx="10" fill="#FEF3C7" stroke="#CBD5E1" stroke-width="2"/><text x="995" y="492" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="995" dy="0">TB5 Azure adapters</tspan><tspan x="995" dy="26.4">Unsigned auth stub</tspan><tspan x="995" dy="26.4">URL-only storage stub</tspan></text><path d="M825 375 V410 H1160 V700 H1100" fill="none" stroke="#60758B" stroke-width="2"  marker-end="url(#arrow)" /><rect x="550" y="660" width="550" height="110" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="825" y="710" text-anchor="middle" font-family="Arial" font-size="22" fill="#183B56"><tspan x="825" dy="0">TB6 Messaging and logs</tspan><tspan x="825" dy="26.4">Device tokens and family activity</tspan></text><text x="825" y="815" text-anchor="middle" font-family="Arial" font-size="21" fill="#183B56"><tspan x="825" dy="0">Credentials and requests cross TB3</tspan><tspan x="825" dy="25.2">Identity and tenant checks must precede access</tspan></text><text x="30" y="915" text-anchor="start" font-family="Arial" font-size="20" fill="#60758B"><tspan x="30" dy="0">The current Android app does not call the API. Boundary numbers match the threat register.</tspan></text></svg>